# Deploys the site to GitHub Pages with a fresh daily snapshot of market data (scripts/update_data.py).
name: Deploy with market data

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * 1-5" # after the US close, Monday to Friday
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_data.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
